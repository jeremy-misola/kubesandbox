# Default values for kubesandbox-backend.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 2

image:
  repository: jurassicjey/kubesandbox-backend
  pullPolicy: Always
  tag: "latest"

# Single source of truth for the ttyd shell (workspace) image used by every
# sandbox. Templated into three places so a shell-image bump is a one-line
# change here: the XRD schema default, the Crossplane composition's pod image,
# and the backend's WORKSPACE_IMAGE env (what it stamps onto every claim).
# Keep this tag in step with ttyd/VERSION, which drives the image build/push.
workspaceImage: "jurassicjey/ttyd-k8s:1.0.1"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# ServiceAccount configuration
serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000

service:
  type: ClusterIP
  port: 8080

# Ingress is disabled in favor of HTTPRoute (Gateway API)
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

# HTTPRoute configuration for Gateway API
httpRoute:
  enabled: true
  annotations: {}
  parentRefs:
    - name: kubesandbox
      namespace: envoy-gateway-system
  hostnames:
    - "kubesandbox.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            add:
              - name: X-Forwarded-Proto
                value: "https"

# Resource configuration
resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

# Health probes
livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

# Autoscaling (disabled by default)
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

volumes: []
volumeMounts: []

nodeSelector: {}
tolerations: []
affinity: {}

# Application configuration
config:
  # Server port
  port: "8080"
  # Namespace where sessions are created
  namespace: "playground"
  # Public origin used to build session URLs ({base}/s/{id})
  publicBaseUrl: "https://kubesandbox.com"
  # Headers for authentication (injected by Envoy Gateway JWT claimToHeaders)
  userEmailHeader: "X-User-Email"
  userNameHeader: "X-User-Name"
  userGroupsHeader: "X-User-Groups"
  # Stable subject id; preferred over email as ownerRef when present
  userIdHeader: "X-User-Id"
  # TTL cleanup interval in minutes (reserved for the G3 TTL loop)
  ttlCleanupInterval: "1"

# OTel metrics (docs/reference/observability-architecture.md): the backend
# pushes OTLP/HTTP metrics to the node-local otel-collector agent (DaemonSet),
# whose metrics pipeline remote-writes to Mimir (tenant: prod). Query in
# Grafana via the existing "Mimir" datasource, job="kubesandbox-backend".
telemetry:
  enabled: true
  # Node-local agent via the downward API ($(HOST_IP) expands to status.hostIP).
  # Standard DaemonSet pattern: each pod talks to the agent on its own node.
  otlpEndpoint: "http://$(HOST_IP):4318"
  # Lands as the deployment.environment resource attribute.
  environment: prod
  # Periodic reader export interval (ms). 15s oversamples the [5m] dashboard
  # windows comfortably.
  exportIntervalMs: "15000"
  # Grafana dashboard ConfigMap (sidecar auto-import via grafana_dashboard
  # label). Off by default: enable only if the Grafana sidecar watches all
  # namespaces (sidecar.dashboards.searchNamespace=ALL); otherwise import
  # dashboards/kubesandbox-backend-pool.json manually or ship it via the
  # monitoring GitOps app instead.
  dashboard:
    enabled: false

# Hot warm-pool (docs/history/hot-pool-implementation-brief.md): keep N pre-provisioned sandboxes RUNNING so a
# create request is a metadata-only assignment (sub-15s) instead of a cold
# build (10+ min). Empty pool => requests queue (202 + /api/queue/events).
pool:
  enabled: true
  # Hot, unclaimed sandboxes to keep Ready (sign-off: ~2-3 vs ~5/hour peak,
  # idle budget <=10).
  targetWarm: 2
  # Concurrent-session ceiling: warm + live claims never exceed this.
  maxTotal: 60
  # Unclaimed members older than this are recycled, never handed out.
  maxWarmAgeHours: 24
  # Pool manager periodic reconcile (safety net behind the claim watch).
  resyncSeconds: 30

# Redis-backed assign queue — required for replicaCount > 1
# (backend/docs/redis-queue-horizontal-scaling.md). With neither redis.enabled
# nor redis.addr set, the backend uses its in-memory queue (single-replica
# only; the chart refuses to render replicaCount > 1 in that case).
redis:
  # Deploy an in-chart single-instance Redis (StatefulSet + Service, AOF
  # everysec) and point the backend at it.
  enabled: true
  image: "redis:7.4-alpine"
  # Point at an external/managed Redis instead (host:port). Ignored when
  # enabled: true (the in-chart Service address wins).
  addr: ""
  # Logical database index.
  db: 0
  # Key namespace for all backend keys.
  keyPrefix: "ksbx:"
  # Connection-establishment timeout (REDIS_DIAL_TIMEOUT_SECONDS).
  dialTimeoutSeconds: 5
  # Optional AUTH: name of an existing Secret in the release namespace with
  # key "redis-password". Empty = no AUTH (in-cluster access is already
  # restricted to backend pods by NetworkPolicy).
  existingSecret: ""
  # AOF persistence. The queue is recoverable by design (clients re-POST), so
  # losing it is degraded UX, not corruption — but persistence is cheap and
  # avoids bouncing every queued user on a Redis restart.
  persistence:
    enabled: true
    size: 1Gi
    # Empty = cluster default StorageClass (k3s: local-path).
    storageClass: ""
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

# Queue behavior (Redis-backed queue only).
queue:
  # Entries waiting longer than this are expired by the reconcile janitor with
  # a terminal error event (entries survive deploys now; this replaces the
  # implicit cap process restarts used to provide). 0 disables.
  maxWaitMinutes: 60

# Lease-based leader election for the pool reconcile loop: exactly one replica
# reconciles; the rest serve HTTP and stand by. Safe (and default-on) at
# 1 replica; REQUIRED for replicaCount > 1. The Lease lives in
# config.namespace next to the claims it guards.
leaderElection:
  enabled: true

# Guided challenges (docs/history/challenges-backend-architecture.md): content
# comes from the kubesandbox-challenges chart (one ConfigMap per bundle in
# config.namespace); the backend seeds asynchronously after assignment and
# grades on demand against the tenant vcluster. Timing knobs mirror the
# design defaults; none should need tuning in normal operation.
challenges:
  enabled: true
  # Budget for one seed apply attempt (measured bundle apply is 1-2s; §6.2).
  seedTimeoutSeconds: 10
  # Budget for the delete-and-wait phase of a challenge reset.
  resetTimeoutSeconds: 60
  # Retry-in-place ceiling per member before recycle-and-reassign (§6.3).
  seedMaxAttempts: 3
  # Backoff between in-place retries.
  seedBackoffSeconds: 2
  # Seeder level-triggered reconcile interval (crash-resume backstop).
  seedResyncSeconds: 30
  # Concurrent seed workers (CAS + SSA make concurrency safe).
  seedWorkers: 2
  # Per-session grade rate limit -> 429 under this interval (§7).
  gradeMinIntervalSeconds: 2
  # Content store list resync backstop behind the ConfigMap watch.
  contentResyncSeconds: 300

# vcluster control-plane shape (patched into the composition's Release values).
# Burstable on purpose: the API server is CPU-hungry only during boot; the old
# flat 200m limit inflated cold boot ~6x (docs/history/pause-resume-spike.md) and throttled pool refill.
vcluster:
  controlPlane:
    cpuRequest: 200m
    cpuLimit: 2000m

# RBAC configuration
rbac:
  create: true

# NetworkPolicy: restrict who can reach the backend.
# SECURITY (G1 defense-in-depth): the backend trusts X-User-* identity headers,
# so only the Envoy Gateway may reach it — otherwise any pod could spoof identity
# on /api and /authz. Enabled by default; k3s enforces NetworkPolicy natively.
networkPolicy:
  enabled: true
  # Namespace of the Envoy Gateway allowed to reach the backend, selected by the
  # auto-applied kubernetes.io/metadata.name label.
  gatewayNamespace: envoy-gateway-system
  # Optional extra ingress rules (e.g. an in-cluster Prometheus scraper).
  extraIngress: []

# Authentication: JWT SecurityPolicy on the /api route (G1 identity source).
# Disabled by default so installing the chart never breaks an existing route;
# enable once the Authentik backend client / issuer is confirmed.
authentication:
  enabled: false
  jwt:
    providerName: authentik
    # Token issuer (must match the `iss` claim). Example for an Authentik app:
    #   https://auth.jeremymr.dev/application/o/kubesandbox-backend/
    issuer: ""
    # Authentik JWKS endpoint, typically the issuer + "jwks/"
    jwksUri: ""
    # Optional: enforce token audience(s). Empty = do not enforce.
    audiences: []
    # Map validated JWT claims into the X-User-* headers the backend trusts.
    claimToHeaders:
      - claim: sub
        header: X-User-Id
      - claim: email
        header: X-User-Email
      - claim: name
        header: X-User-Name
      - claim: groups
        header: X-User-Groups
    # Extra JWT providers whose tokens the /api route should ALSO trust (Envoy
    # accepts a token matching ANY provider). Use this to trust the SPA's public
    # `kubesandbox-frontend` client, whose tokens carry a different `iss` than the
    # backend client. Empty = only the primary provider above is trusted.
    # Each entry: { name, issuer, jwksUri, audiences?, claimToHeaders? }.
    #   additionalProviders:
    #     - name: kubesandbox-frontend
    #       issuer: "https://auth.jeremymr.dev/application/o/kubesandbox-frontend/"
    #       jwksUri: "https://auth.jeremymr.dev/application/o/kubesandbox-frontend/jwks/"
    #       claimToHeaders:
    #         - { claim: sub, header: X-User-Id }
    #         - { claim: email, header: X-User-Email }
    #         - { claim: name, header: X-User-Name }
    #         - { claim: groups, header: X-User-Groups }
    additionalProviders: []

# Session ownership enforcement (G2 Option B) — backend-owned session auth.
#
# Design (post-spike 2026-06-27, Options A+B):
#   A. Session HTTPRoutes are in the shared kubesandbox namespace (composition
#      change) so this SecurityPolicy can attach via targetSelectors.
#   B. The backend drives the complete OIDC flow. The SecurityPolicy does
#      ext-authz ONLY: no edge OIDC/JWT. The backend /authz endpoint checks the
#      session cookie and either redirects to Authentik (login) or checks
#      ownership (allow/deny).
#
# Before enabling:
#   1. Ensure the Terraform Workspace (kubesandbox-backend-auth.yaml) has been
#      applied — it registers /oauth2/callback as the redirect URI on the Authentik
#      client AND generates the SESSION_SECRET, writing both to the Secret named in
#      sessionAuth.oidc.clientSecret.name (kubesandbox-backend-client-secret).
#      Keys written: client-id, client-secret, session-secret, issuer-url, jwks-uri.
#   2. Set sessionAuth.oidc.* values (issuer, clientID, redirectURI).
#   3. Set sessionAuth.oidc.clientSecret.name to the Secret name above.
#      Both OIDC_CLIENT_SECRET (key: client-secret) and SESSION_SECRET
#      (key: session-secret) are read from this same Secret.
#   4. Verify on dev: unauthenticated browser → 302 to Authentik → login →
#      cookie set → /s/{id} opens. User B → 403.
sessionAuth:
  enabled: false

  # OIDC configuration for the backend-owned login flow (Option B).
  oidc:
    # Authentik provider issuer URL for the kubesandbox-backend app.
    # e.g. https://auth.jeremymr.dev/application/o/kubesandbox-backend/
    issuer: ""
    # OAuth2 client_id registered in Authentik (e.g. kubesandbox-backend).
    clientID: ""
    # Callback URL registered in Authentik; must match character-for-character.
    # e.g. https://kubesandbox.com/oauth2/callback
    redirectURI: ""
    # Authorization endpoint. Derived from issuer if empty
    # (issuer + "authorize/"). Override if Authentik is behind split-DNS.
    authEndpoint: ""
    # Token endpoint. Derived from issuer if empty (issuer + "token/").
    tokenEndpoint: ""
    # Reference to the Crossplane-managed Secret holding OIDC credentials.
    # Written by kubesandbox-backend-auth.yaml Workspace. Contains:
    #   client-secret  — OIDC client_secret (OIDC_CLIENT_SECRET)
    #   session-secret — HMAC key for cookies + PKCE state (SESSION_SECRET)
    clientSecret:
      name: ""       # e.g. kubesandbox-backend-client-secret
      namespace: ""  # defaults to the chart's release namespace

  # How long the session cookie is valid. Default 8 hours.
  sessionMaxAgeSeconds: 28800

  extAuth:
    # Defaults to this chart's backend Service and service.port.
    backendServiceName: ""
    backendServicePort: ""
    # Namespace of the backend Service. Leave empty if it is in the same
    # namespace as this policy (i.e. the release namespace = kubesandbox).
    backendServiceNamespace: ""
    path: "/authz"

# Backstop sweep CronJob (G3): deletes orphaned session namespaces (managed,
# older than maxAgeHours, with no surviving claim). Safety net for the
# 2026-06-24 post-mortem. Starts in dryRun so the first runs only LOG what they
# would delete — set dryRun: false once you've confirmed the output.
sweep:
  enabled: true
  dryRun: true
  schedule: "*/30 * * * *"
  maxAgeHours: 24
  # Image needs a POSIX shell + kubectl. The sweep script parses timestamps with
  # both GNU and busybox `date`, so coreutils- or busybox-based images both work.
  # (NB: bitnami/kubectl Docker Hub tags were removed in 2025; don't use them.)
  image: "alpine/k8s:1.31.1"
  backoffLimit: 1
  activeDeadlineSeconds: 300
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3