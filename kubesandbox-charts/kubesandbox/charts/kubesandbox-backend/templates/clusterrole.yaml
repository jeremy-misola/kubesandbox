{{- if .Values.rbac.create -}}
# Namespace-scoped Role (not ClusterRole) — the backend only ever operates
# against claims in .Values.config.namespace (SessionService always calls
# client.Resource(GVR).Namespace(cfg.Namespace)), so this grants the exact
# same access the backend actually uses, just without cluster-wide reach.
#
# SECURITY: this used to be a ClusterRole bound cluster-wide, which let the
# backend ServiceAccount read every Secret in every namespace on the cluster
# (Argo/Authentik/other apps' credentials included) if it were ever
# compromised — a large blast radius for no functional benefit. The `secrets`
# and `namespaces` grants have been removed entirely: the backend Go code
# never calls the Secrets or Namespaces API against THIS namespace. The one
# Secret the backend does read — the per-session vcluster kubeconfig for
# challenge seeding/grading — is granted by a per-session Role/RoleBinding
# composed into each session namespace, restricted with resourceNames to
# exactly that Secret (see kubeconfig-reader-role in the composition, design
# docs/history/challenges-backend-architecture.md §5.2). Never restore a
# cluster-wide secrets grant here.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "kubesandbox-backend.fullname" . }}
  namespace: {{ .Values.config.namespace }}
  labels:
    {{- include "kubesandbox-backend.labels" . | nindent 4 }}
rules:
  # Permission to manage KubeSandboxSession claims in this namespace only.
  - apiGroups: ["platform.kubesandbox.com"]
    resources:
      - kubesandboxsessions
      - kubesandboxsessions/status
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # ConfigMaps in this namespace serve two backend features:
  # 1. Per-owner marker ConfigMaps (hot-pool Phase D): the one-sandbox-per-user
  #    guarantee is an atomic ConfigMap create (name derived from the owner).
  # 2. Challenge bundle ConfigMaps (guided challenges, design §4): the
  #    ContentStore list/watches sbxchallenge-* ConfigMaps rendered by the
  #    kubesandbox-challenges chart into this same namespace (read-only use;
  #    the write verbs below exist for the markers).
  - apiGroups: [""]
    resources:
      - configmaps
    verbs: ["get", "list", "watch", "create", "update", "delete"]
{{- end }}