# Default values for helm.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# This will set the replicaset count more information can be found here: https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/
replicaCount: 1

# This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
image:
  repository: jurassicjey/kubesandbox-frontend
  # This sets the pull policy for images.
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: "latest"

# This is for the secrets for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: []
# This is to override the chart name.
nameOverride: ""
fullnameOverride: ""

# This section builds out the service account more information can be found here: https://kubernetes.io/docs/concepts/security/service-accounts/
serviceAccount:
  # Specifies whether a service account should be created.
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account.
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template.
  name: ""

# This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}
# This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

# This is for setting up a service more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/
service:
  # This sets the service type more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types
  type: ClusterIP
  # This sets the ports more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#field-spec-ports
  port: 8080

# This block is for setting up the ingress for more information can be found here: https://kubernetes.io/docs/concepts/services-networking/ingress/
ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
    # - secretName: chart-example-tls
    #   hosts:
    #     - chart-example.local

# -- Expose the service via gateway-api HTTPRoute
# (see: https://gateway-api.sigs.k8s.io/guides/)
httpRoute:
  # HTTPRoute enabled.
  enabled: true
  # HTTPRoute annotations.
  annotations: {}
  # Which Gateways this Route is attached to.
  parentRefs:
  - name: kubesandbox
    namespace: envoy-gateway-system
  # Hostnames matching HTTP header.
  hostnames:
  - kubesandbox.com
  # Public paths that don't require authentication
  # These will be served without OIDC authentication
  publicPaths:
  - path: /
    type: PathPrefix
  - path: /health/livez
    type: Exact
  - path: /health/readyz
    type: Exact
  - path: /assets
    type: PathPrefix
  # Protected paths that require Envoy edge OIDC authentication.
  # Empty by design: the SPA runs its OWN Authorization Code + PKCE flow
  # (public Authentik client, tokens in memory) — see
  # docs/reference/frontend-architecture.md §4.1. The terminal is NOT a frontend route:
  # it is the backend's /s/{id} (backend-owned OIDC + ext-authz). /terminal/:id is
  # only a client-side hand-off page inside the public SPA bundle, already served
  # by the "/" publicPath. Leaving this empty disables the frontend
  # SecurityPolicy and the protected HTTPRoute.
  protectedPaths: []
  # NOTE: /api is intentionally NOT listed here. The kubesandbox-backend chart
  # owns the /api HTTPRoute (with its JWT SecurityPolicy). Adding /api here makes
  # the frontend's older protected route shadow the backend route (equal path
  # specificity -> oldest route wins), sending /api to the frontend's OIDC and
  # never reaching the backend's JWT policy.
  #   filters:
  #   - type: RequestHeaderModifier
  #     requestHeaderModifier:
  #       set:
  #       - name: My-Overwrite-Header
  #         value: this-is-the-only-value
  #       remove:
  #       - User-Agent
  # - matches:
  #   - path:
  #       type: PathPrefix
  #       value: /echo
  #     headers:
  #     - name: version
  #       value: v2

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# This is to setup the liveness and readiness probes more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
livenessProbe:
  httpGet:
    path: /health/livez
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
readinessProbe:
  httpGet:
    path: /health/readyz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5

# Environment variables injected into the running container. docker-entrypoint.sh
# reads these at start and writes /config.js (window.__ENV), which src/config.ts
# resolves before the bundle — so ONE built image promotes across environments
# (see docs/reference/frontend-architecture.md §7). These can be overridden per-env by
# the GitOps-Homelab frontend values files.
env:
  # Base path for the control API. The backend serves /api (router.go), NOT /api/v1.
  VITE_API_BASE: "/api"
  # Origin used to build the terminal hand-off URL: ${VITE_PUBLIC_BASE_URL}/s/{id}
  VITE_PUBLIC_BASE_URL: "https://kubesandbox.com"
  # Authentik OIDC — frontend PUBLIC client (Auth Code + PKCE, no secret in browser).
  VITE_OIDC_ISSUER: "https://auth.jeremymr.dev/application/o/kubesandbox-frontend/"
  VITE_OIDC_CLIENT_ID: "kubesandbox-frontend"
  # Must match the redirect URI registered on the Authentik client EXACTLY.
  VITE_OIDC_REDIRECT_URI: "https://kubesandbox.com/auth/callback"

# This section is for setting up autoscaling more information can be found here: https://kubernetes.io/docs/concepts/workloads/autoscaling/
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Additional volumes on the output Deployment definition.
volumes: []
  # - name: foo
  #   secret:
  #     secretName: mysecret
  #     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
  # - name: foo
  #   mountPath: "/etc/foo"
  #   readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}

# -- Authentication configuration for Envoy Gateway SecurityPolicy.
#
# DISABLED by design. The SPA runs its own Authorization Code + PKCE flow against
# Authentik as a PUBLIC client and attaches the bearer to /api itself
# (docs/reference/frontend-architecture.md §4.1). There is therefore no Envoy edge OIDC
# on the frontend routes, and no client_secret in the browser. This block is kept
# (disabled) only for reference / a possible future edge-OIDC fallback.
#
# When enabled=false the SecurityPolicy template renders nothing, so the
# oidc.* values below and the kubesandbox-frontend-client-secret are unused.
authentication:
  # Enable Envoy edge OIDC authentication (leave false — SPA owns PKCE).
  enabled: false
  oidc:
    # Authentik application OIDC issuer URL
    issuer: "https://auth.jeremymr.dev/application/o/kubesandbox-frontend/"
    # OAuth2 client ID (must match Authentik application)
    clientId: "kubesandbox-frontend"
    # Kubernetes secret containing the client secret
    # This secret is created by the Crossplane Terraform workspace
    clientSecret:
      name: "kubesandbox-frontend-client-secret"
      namespace: "kubesandbox"
    # OAuth2 redirect URL (must match Authentik application configuration)
    redirectUrl: "https://kubesandbox.com/auth/callback"
    # Optional: logout path for signing out
    logoutPath: "/auth/logout"
  # Optional: custom cookie names for session management
  # cookieNames:
  #   accessToken: "access_token"
  #   idToken: "id_token"
