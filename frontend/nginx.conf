server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Health endpoints expected by the Helm chart probes.
    location = /health/livez {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok";
    }
    location = /health/readyz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok";
    }

    # Never cache the runtime config or the HTML shell.
    location = /config.js {
        add_header Cache-Control "no-store";
    }
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Hashed asset bundles are immutable.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback. NOTE: /api and /s/{id} are routed by the Envoy Gateway to the
    # backend, not by nginx — they never reach this container.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
